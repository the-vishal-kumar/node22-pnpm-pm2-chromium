name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Weekly rebuild so the image picks up patched node:22-alpine and Alpine
  # packages even when nothing in this repo changes. (Mondays 03:17 UTC.)
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Least privilege: the job only reads the repo. Docker Hub auth uses the
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets, not the GitHub token.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: thevishalkumar/node22-pnpm-pm2-chromium
  PLATFORMS: linux/amd64,linux/arm64
  # Scheduled runs rebuild from scratch so `apk add` re-resolves to the
  # latest patched packages instead of reusing a cached layer.
  NO_CACHE: ${{ github.event_name == 'schedule' }}

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build the amd64 variant into the local Docker daemon so it can be
      #    smoke-tested, version-probed and scanned before anything is pushed.
      - name: Build image for testing (amd64, not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          no-cache: ${{ env.NO_CACHE == 'true' }}
          tags: ${{ env.IMAGE }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (offline, non-root)
        run: |
          docker run --rm --network none -u node "$IMAGE:ci" sh -euc '
            node --version
            pnpm --version
            pm2 --version >/dev/null
            chromium --headless --no-sandbox --disable-gpu \
              --dump-dom "data:text/html,<p>ok</p>" 2>/dev/null | grep -q "<p>ok</p>"
          '

      # 2. Fail the build on any CRITICAL vulnerability that has a fix
      #    available. Unfixed CVEs are reported by upstream but can't be
      #    patched here, so they don't block the weekly rebuild.
      #    The action is pinned to a commit SHA (v0.36.0), not a movable tag.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          version: v0.70.0
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # 3. Derive versioned tags from what is actually inside the image, e.g.
      #    22.23.4-pnpm12.6.0 and 22.23.4-pnpm12.6.0-20261110.
      - name: Compute tags
        id: meta
        run: |
          node_v="$(docker run --rm "$IMAGE:ci" node --version | sed 's/^v//')"
          pnpm_v="$(docker run --rm --network none "$IMAGE:ci" pnpm --version)"
          chromium_v="$(docker run --rm "$IMAGE:ci" chromium --version | awk '{print $2}')"
          date_tag="$(date -u +%Y%m%d)"
          {
            echo "node=$node_v"
            echo "pnpm=$pnpm_v"
            echo "chromium=$chromium_v"
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:22"
            echo "$IMAGE:22-chromium"
            echo "$IMAGE:${node_v}-pnpm${pnpm_v}"
            echo "$IMAGE:${node_v}-pnpm${pnpm_v}-${date_tag}"
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              echo "$IMAGE:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Show tags
        run: |
          echo "Node ${{ steps.meta.outputs.node }}, pnpm ${{ steps.meta.outputs.pnpm }}, Chromium ${{ steps.meta.outputs.chromium }}"
          echo "${{ steps.meta.outputs.tags }}"

      # 4. Publish (never on pull requests: fork PRs have no secrets).
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          no-cache: ${{ env.NO_CACHE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.node }}-pnpm${{ steps.meta.outputs.pnpm }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
